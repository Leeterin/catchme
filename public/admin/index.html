<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>CATCHME 관리자</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --text:#111827; --text-dim:#6b7280;
    --accent:#3b82f6; --danger:#ef4444; --danger-bg:#fef2f2; --warn:#f59e0b; --ok:#10b981;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--text); font-size:14px;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- 로그인 화면 ---------- */
  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; }
  .login-card h1{ font-size:18px; margin:0 0 4px; }
  .login-card p{ font-size:12.5px; color:var(--text-dim); margin:0 0 24px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .field input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; outline:none; }
  .field input:focus{ border-color:var(--accent); }
  .btn-primary{ width:100%; padding:11px; border:none; border-radius:10px; background:var(--text); color:#fff; font-size:14px; font-weight:600; margin-top:8px; }
  .btn-primary:disabled{ opacity:0.5; cursor:default; }
  .error-msg{ color:var(--danger); font-size:12.5px; margin-top:12px; display:none; }

  /* ---------- 앱 레이아웃 ---------- */
  #appScreen{ display:none; min-height:100vh; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .topbar h1{ font-size:16px; margin:0; }
  .topbar .who{ font-size:12.5px; color:var(--text-dim); }
  .logout-btn{ border:1px solid var(--line); background:none; padding:6px 12px; border-radius:8px; font-size:12.5px; }
  .tabs{ display:flex; gap:2px; padding:10px 24px 0; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab-btn{ border:none; background:none; padding:10px 14px; font-size:13px; color:var(--text-dim); border-bottom:2px solid transparent; font-weight:600; white-space:nowrap; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--text); }
  .content{ max-width:960px; margin:0 auto; padding:24px; }
  .metric-row{ display:grid; grid-template-columns:170px 1fr 92px; align-items:center; gap:10px; padding:7px 0; font-size:13px; }
  .metric-row .bar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
  .metric-row .bar span{ display:block; height:100%; background:#2563eb; border-radius:5px; }
  .metric-row .num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--text-dim); font-size:12px; }
  .metric-row .num b{ color:var(--text); font-size:13px; }
  .metric-table{ width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .metric-table th, .metric-table td{ padding:7px 6px; border-bottom:1px solid var(--line); text-align:right; }
  .metric-table th:first-child, .metric-table td:first-child{ text-align:left; }
  .metric-table th{ color:var(--text-dim); font-weight:600; }
  .metrics-notice{ background:#fef3c7; color:#92400e; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; }
  .section{ display:none; }
  .section.active{ display:block; }

  /* ---------- 대시보드 ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .stat-card .label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .stat-card .value{ font-size:24px; font-weight:700; }
  .stat-card .sub{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }

  /* ---------- 대시보드 그래프 ---------- */
  .chart-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; }
  .chart-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .chart-title{ font-size:14px; font-weight:700; }
  .chart-controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chart-controls select, .chart-controls input[type=date]{ padding:7px 9px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; background:#fff; color:var(--text); }
  .chart-controls span{ color:var(--text-dim); font-size:12.5px; }
  .chart-controls button{ padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:12.5px; font-weight:600; }
  .chart-legend{ display:flex; align-items:center; gap:14px; margin-bottom:8px; flex-wrap:wrap; }
  .chart-legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text); font-weight:600; }
  .chart-legend-swatch{ width:16px; height:3px; border-radius:2px; background:var(--accent); display:inline-block; }
  .chart-summary{ font-size:12px; color:var(--text-dim); margin-bottom:10px; }
  .chart-svg-wrap{ width:100%; overflow-x:auto; }
  .chart-svg-wrap svg{ display:block; width:100%; height:220px; }
  .chart-axis-line{ stroke:var(--line); stroke-width:1; }
  .chart-grid-label{ font-size:9px; fill:var(--text-dim); font-family:inherit; }
  .chart-x-label{ font-size:9px; fill:var(--text-dim); font-family:inherit; }
  .chart-line-path{ fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .chart-point-hit{ fill:transparent; }

  /* ---------- 상세 모달 ---------- */
  .detail-modal-box{ width:100%; max-width:480px; max-height:80vh; overflow-y:auto; background:#fff; border-radius:16px; padding:22px 20px; }
  .detail-modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .detail-modal-header h2{ font-size:15px; margin:0; }
  .detail-modal-header button{ border:none; background:none; font-size:18px; color:var(--text-dim); line-height:1; padding:4px; }
  .detail-section{ margin-bottom:14px; }
  .detail-row-title{ font-weight:700; font-size:14px; margin-bottom:4px; }
  .detail-row-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .detail-stat-row{ display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
  .detail-stat{ flex:1; min-width:70px; text-align:center; background:var(--bg); border-radius:10px; padding:10px 6px; }
  .detail-stat .n{ font-size:16px; font-weight:700; }
  .detail-stat .l{ font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .detail-subheading{ font-size:12px; font-weight:700; color:var(--text-dim); margin:14px 0 6px; text-transform:uppercase; letter-spacing:0.02em; }
  .detail-list-item{ font-size:12.5px; padding:8px 0; border-bottom:1px solid var(--line); }
  .detail-list-item:last-child{ border-bottom:none; }
  .detail-empty{ font-size:12.5px; color:var(--text-dim); padding:8px 0; }
  .detail-photo-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:8px; }
  .detail-photo-grid img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; background:var(--bg); }

  /* ---------- 공용 ---------- */
  .toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text]{ flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; }
  .toolbar select{ padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; background:#fff; }
  .toolbar button{ padding:9px 14px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:13px; font-weight:600; }
  .list-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .row-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .badge{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; white-space:nowrap; }
  .badge.suspended{ background:var(--danger-bg); color:var(--danger); }
  .badge.pending{ background:#fffbeb; color:var(--warn); }
  .badge.cancelled{ background:var(--danger-bg); color:var(--danger); }
  .badge.action{ background:#eff6ff; color:var(--accent); }
  .row-actions{ display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .row-actions button{ padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:600; }
  .row-actions button.danger{ color:var(--danger); border-color:#fecaca; }
  .row-actions button.ok{ color:var(--ok); border-color:#a7f3d0; }
  .empty-state{ padding:40px 18px; text-align:center; color:var(--text-dim); font-size:13px; }
  .pagination{ display:flex; justify-content:center; gap:8px; margin-top:16px; }
  .pagination button{ padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:12.5px; }
  .pagination button:disabled{ opacity:0.4; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#111827; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity 0.2s; z-index:200; max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  /* ---------- 커스텀 모달 (브라우저 기본 confirm/prompt는 일부 환경에서 조용히 막혀서 직접 구현) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(17,24,39,0.45); display:none;
    align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{ width:100%; max-width:360px; background:#fff; border-radius:16px; padding:22px 20px; }
  .modal-box .modal-title{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .modal-box .modal-desc{ font-size:12.5px; color:var(--text-dim); margin-bottom:14px; white-space:pre-line; }
  .modal-box input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; margin-bottom:6px; }
  .modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .modal-actions button{ flex:1; padding:10px; border-radius:9px; font-size:13.5px; font-weight:600; border:1px solid var(--line); background:#fff; }
  .modal-actions button.confirm{ background:var(--text); color:#fff; border-color:var(--text); }
  .modal-actions button.confirm.danger{ background:var(--danger); border-color:var(--danger); }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>CATCHME 관리자</h1>
    <p>관리자 계정으로만 접근할 수 있어요.</p>
    <form id="loginForm">
      <div class="field">
        <label>아이디 또는 이메일</label>
        <input type="text" id="loginId" autocomplete="username" required />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPw" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">로그인</button>
      <div class="error-msg" id="loginError"></div>
    </form>
  </div>
</div>

<div id="appScreen">
  <div class="topbar">
    <h1>CATCHME 관리자</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="who" id="whoAmI"></span>
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">대시보드</button>
    <button class="tab-btn" data-tab="metrics">지표</button>
    <button class="tab-btn" data-tab="users">유저 관리</button>
    <button class="tab-btn" data-tab="reports">신고 처리</button>
    <button class="tab-btn" data-tab="feed">소식 관리</button>
    <button class="tab-btn" data-tab="meetups">모임 관리</button>
    <button class="tab-btn" data-tab="logs">활동 로그</button>
  </div>

  <div class="content">
    <div class="section active" id="section-dashboard">
      <div class="stat-grid" id="statGrid"></div>

      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">일별 추이</div>
          <div class="chart-controls">
            <select id="statsMetricSelect">
              <option value="feedPosts">소식 게시물</option>
              <option value="users">신규 가입</option>
              <option value="meetups">모임 생성</option>
            </select>
            <input type="date" id="statsStartInput" />
            <span>~</span>
            <input type="date" id="statsEndInput" />
            <button id="statsRefreshBtn">조회</button>
          </div>
        </div>
        <div id="statsChartWrap"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </div>

    <!-- 새로 온 사람이 실제로 쓰기 시작하는지(활성화) + 다시 오는지(재방문) -->
    <div class="section" id="section-metrics">
      <div class="toolbar">
        <span style="font-size:12.5px;color:var(--text-dim);">가입일</span>
        <input type="date" id="metricsStartInput" />
        <span>~</span>
        <input type="date" id="metricsEndInput" />
        <button id="metricsRefreshBtn">조회</button>
      </div>
      <div id="metricsNotice"></div>
      <div class="chart-card" style="margin-top:0;">
        <div class="chart-title" style="margin-bottom:12px;">활성화 — 가입한 사람 중 몇 %가 여기까지 왔나</div>
        <div id="metricsFunnel"><div class="empty-state">불러오는 중...</div></div>
      </div>
      <div class="stat-grid" id="metricsRetention" style="margin-top:14px;"></div>
      <div class="chart-card">
        <div class="chart-title" style="margin-bottom:12px;">최근 14일</div>
        <div id="metricsDaily"></div>
      </div>
    </div>

    <div class="section" id="section-users">
      <div class="toolbar">
        <input type="text" id="userSearchInput" placeholder="아이디/이메일/이름으로 검색" />
        <select id="userFilterSelect">
          <option value="all">전체 유저</option>
          <option value="suspended">정지된 계정만</option>
        </select>
        <button id="userSearchBtn">검색</button>
      </div>
      <div class="list-card" id="userList"></div>
      <div class="pagination" id="userPagination"></div>
    </div>

    <div class="section" id="section-reports">
      <div class="toolbar">
        <select id="reportStatusSelect">
          <option value="PENDING">대기중</option>
          <option value="REVIEWED">처리됨</option>
          <option value="DISMISSED">반려됨</option>
        </select>
        <button id="reportRefreshBtn">새로고침</button>
      </div>
      <div class="list-card" id="reportList"></div>
      <div class="pagination" id="reportPagination"></div>
    </div>

    <div class="section" id="section-feed">
      <div class="toolbar">
        <input type="text" id="feedSearchInput" placeholder="제목/한줄평/동네/작성자 아이디로 검색" />
        <button id="feedSearchBtn">검색</button>
      </div>
      <div class="list-card" id="feedList"></div>
      <div class="pagination" id="feedPagination"></div>
    </div>

    <div class="section" id="section-meetups">
      <div class="toolbar">
        <input type="text" id="meetupSearchInput" placeholder="제목/동네/방장 아이디로 검색" />
        <select id="meetupFilterSelect">
          <option value="all">전체</option>
          <option value="active">진행중</option>
          <option value="cancelled">취소됨</option>
        </select>
        <button id="meetupSearchBtn">검색</button>
      </div>
      <div class="list-card" id="meetupList"></div>
      <div class="pagination" id="meetupPagination"></div>
    </div>

    <div class="section" id="section-logs">
      <div class="list-card" id="logList"></div>
      <div class="pagination" id="logPagination"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div id="modalInputWrap" style="display:none;">
      <input type="text" id="modalInput" />
    </div>
    <div class="modal-actions">
      <button id="modalCancelBtn">취소</button>
      <button id="modalConfirmBtn" class="confirm">확인</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModalOverlay">
  <div class="detail-modal-box">
    <div class="detail-modal-header">
      <h2 id="detailModalTitle"></h2>
      <button id="detailModalCloseBtn" aria-label="닫기">✕</button>
    </div>
    <div id="detailModalBody"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
